<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PW, Next Toppers, MissionJEET & Science and Fun All Batches Free Mod Website | RAJNISH PRIME</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .menu-container {
            width: 100%;
            max-width: 450px;
            text-align: left;
            margin-bottom: 10px;
        }
        .menu-btn {
            background: none;
            border: 1px solid #1a1a1a;
            color: #4ade80;
            font-size: 24px;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }
        .logo-box {
            margin-top: 15px;
            margin-bottom: 15px;
        }
        .logo-img {
            width: 100px;
            height: auto;
        }
        h1 {
            font-size: 34px;
            font-weight: 700;
            text-align: center;
            line-height: 1.2;
            margin-bottom: 10px;
        }
        .brand-name {
            color: #4ade80;
        }
        .tagline {
            font-size: 15px;
            color: #ffffff;
            margin-bottom: 35px;
            text-align: center;
            font-weight: 500;
        }
        .tagline .free-text {
            color: #4ade80;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 450px;
        }
        .card {
            background-color: #0a0a0a;
            border: 1px solid #1c1c1e;
            border-radius: 16px;
            padding: 20px 10px;
            text-decoration: none;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background-color 0.2s;
        }
        .card:hover {
            background-color: #121214;
            transform: translateY(-2px);
        }
        .card-icon {
            width: 65px;
            height: 65px;
            border-radius: 14px;
            margin-bottom: 12px;
            object-fit: cover;
        }
        .card-title {
            font-size: 14px;
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- टॉप मेनू बटन -->
    <div class="menu-container">
        <button class="menu-btn">☰</button>
    </div>

    <!-- पांडा या आपका नया लोगो इमेज (आप चाहें तो src लिंक बदल सकते हैं) -->
    <div class="logo-box">
        <img src="https://studypanda.live" alt="Logo" class="logo-img" onerror="this.src='https://placeholder.com'">
    </div>

    <!-- वेलकम हेडलाइन -->
    <h1>Welcome to <br><span class="brand-name">RAJNISH PRIME</span></h1>
    <p class="tagline">Education Must Be <span class="free-text">Free</span> For Everyone</p>

    <!-- प्लेटफॉर्म ग्रिड बटन्स -->
    <div class="grid-container">
        
        <!-- बटन 1: Physics Wallah -->
        <a href="https://studypanda.live" class="card">
            <img src="https://placeholder.com" alt="PW" class="card-icon">
            <span class="card-title">Physics Wallah</span>
        </a>

        <!-- बटन 2: Next Toppers -->
        <a href="https://studypanda.live" class="card">
            <img src="https://placeholder.com" alt="Next Toppers" class="card-icon">
            <span class="card-title">Next Toppers</span>
        </a>

        <!-- बटन 3: Mission JEET -->
        <a href="https://studypanda.live/missionjeet" class="card">
            <img src="https://placeholder.com" alt="Mission JEET" class="card-icon">
            <span class="card-title">Mission JEET</span>
        </a>

        <!-- बटन 4: Unacademy -->
        <a href="https://studypanda.live" class="card">
            <img src="https://placeholder.com" alt="Unacademy" class="card-icon">
            <span class="card-title">Unacademy</span>
        </a>

    </div>

</body>
</html>
